<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07142f">
<title>ADAM ROYALE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#06122e;color:#fff}
body{min-height:100vh;overflow-x:hidden}
.screen{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#1689e8 0%,#54c7f2 43%,#145a83 44%,#092747 100%)}
.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 18%,#fff9 0 2%,transparent 13%),linear-gradient(90deg,#03112c88,transparent 50%,#03112c66)}
.sky{position:absolute;inset:70px 0 0;overflow:hidden;pointer-events:none}
.sun{position:absolute;right:16%;top:6%;width:110px;height:110px;border-radius:50%;background:#fff6a9;box-shadow:0 0 75px 28px #fff8}
.island{position:absolute;left:-8%;right:-8%;bottom:10%;height:43%;background:linear-gradient(160deg,#49b86b,#17643e 60%,#0a3c37);clip-path:polygon(0 28%,12% 12%,22% 23%,34% 3%,48% 18%,61% 0,74% 21%,88% 7%,100% 30%,100% 100%,0 100%);filter:drop-shadow(0 -10px 18px #a5f6ff66)}
.island:after{content:"";position:absolute;inset:22% 0 0;background:repeating-linear-gradient(100deg,transparent 0 90px,#b4e7a522 92px 98px)}
.cloud{position:absolute;color:#fff9;font-size:70px;filter:blur(1px)}.c1{top:8%;left:14%}.c2{top:20%;right:28%;font-size:55px}
nav{height:74px;display:flex;align-items:center;gap:7px;padding:10px 2.5%;background:#04102beF;border-bottom:1px solid #267aff;position:relative;z-index:2}
.logo{font-weight:1000;font-style:italic;font-size:23px;line-height:.82;color:#fff;text-shadow:3px 3px #7c2cff;margin-right:auto;letter-spacing:-1px}
nav button{border:0;color:#fff;background:transparent;padding:12px 13px;border-radius:10px;font-weight:900;cursor:pointer}
nav button:hover,nav button.active{background:#ffd91a;color:#111}.profile{border:2px solid #25c9ff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:21px;margin-left:7px}
.content{min-height:calc(100vh - 74px);position:relative;z-index:1;display:grid;grid-template-columns:minmax(250px,370px) 1fr minmax(220px,300px);gap:18px;padding:25px 3% 112px;align-items:end}
.left{align-self:center}.eyebrow{font-weight:900;color:#a8f1ff;letter-spacing:3px}.headline{font-size:clamp(45px,6vw,78px);font-weight:1000;font-style:italic;line-height:.86;text-shadow:4px 5px #4d13a7;margin:12px 0 26px}
.panel{background:linear-gradient(135deg,#041832ee,#03091ddd);border:1px solid #46caff;border-radius:18px;padding:18px;box-shadow:0 0 22px #078dff55}.panel h2{margin:0 0 5px;font-size:23px}.muted{color:#b8def2;font-size:14px}
.play{width:100%;margin-top:17px;border:0;border-radius:13px;background:linear-gradient(#fff044,#ffbd00);padding:19px;color:#101322;font-size:29px;font-weight:1000;font-style:italic;cursor:pointer;box-shadow:0 5px 0 #a96a00}.play:hover{filter:brightness(1.1);transform:translateY(-2px)}
.center{align-self:end;text-align:center;padding-bottom:18px}.avatar{width:min(260px,26vw);height:370px;margin:auto;position:relative;display:flex;align-items:center;justify-content:center}.avatar:before{content:"";position:absolute;bottom:0;width:260px;height:42px;border-radius:50%;background:#20caff;filter:blur(22px);opacity:.8}.person{position:relative;z-index:1;width:180px;height:325px;filter:drop-shadow(0 12px 12px #00152c)}
/* Personaje original ADAM con camiseta azul estilo PSG */
.adam-character{position:relative;z-index:1;width:220px;height:360px;display:block;filter:drop-shadow(0 12px 12px #00152c)}
.doll-head{position:absolute;top:5px;left:59px;width:62px;height:72px;border-radius:46% 46% 44% 44%;background:linear-gradient(90deg,#a85f3e,#e3a078 48%,#b96b49);z-index:4;border:2px solid #78432f}
.doll-hair{position:absolute;top:0;left:57px;width:66px;height:30px;border-radius:55% 55% 25% 25%;background:#17151a;z-index:5;box-shadow:inset 0 -5px #30242a}
.doll-hair:after{content:"";position:absolute;right:3px;top:14px;width:18px;height:19px;background:#17151a;border-radius:0 0 80% 20%;transform:rotate(-18deg)}
.doll-ear{position:absolute;top:33px;width:12px;height:19px;border-radius:50%;background:#c9825e;z-index:3}.doll-ear.left{left:53px}.doll-ear.right{right:53px}
.doll-face{position:absolute;top:39px;left:74px;width:7px;height:5px;border-radius:50%;background:#211b1b;z-index:6;box-shadow:22px 0 #211b1b}
.doll-face:after{content:"";position:absolute;top:17px;left:7px;width:16px;height:7px;border-bottom:2px solid #713c32;border-radius:50%}
.doll-neck{position:absolute;top:69px;left:80px;width:22px;height:25px;background:#bd7958;z-index:2}
.doll-shirt{position:absolute;top:85px;left:37px;width:108px;height:119px;border-radius:18px 18px 10px 10px;background:linear-gradient(90deg,#071c4c 0 38%,#e62d4e 39% 44%,#fff 45% 49%,#e62d4e 50% 55%,#071c4c 56%);border:3px solid #d6eaff;z-index:3;box-shadow:inset 0 0 0 5px #173d78}
.doll-shirt:before{content:"PSG";position:absolute;top:45px;left:35px;color:white;font-size:16px;font-weight:1000;text-shadow:1px 1px #d51f47}
.doll-shirt:after{content:"ADAM";position:absolute;top:72px;left:31px;color:#fff;font-size:11px;font-weight:1000;letter-spacing:1px}
.doll-arm{position:absolute;top:99px;width:32px;height:105px;border-radius:18px;background:linear-gradient(90deg,#a75f40,#d99570);z-index:2}
.doll-arm.left{left:17px;transform:rotate(8deg)}.doll-arm.right{right:17px;transform:rotate(-8deg)}
.doll-shorts{position:absolute;top:197px;left:42px;width:98px;height:58px;background:#101a35;border:3px solid #d6eaff;border-radius:4px 4px 15px 15px;z-index:3}
.doll-leg{position:absolute;top:247px;width:34px;height:63px;border-radius:8px 8px 12px 12px;background:linear-gradient(90deg,#ad684a,#d18b67);z-index:2}
.doll-leg.left{left:56px}.doll-leg.right{right:56px}
.doll-sock{position:absolute;top:283px;width:35px;height:24px;background:#fff;border-top:5px solid #e52b4b;z-index:3}.doll-sock.left{left:55px}.doll-sock.right{right:55px}
.doll-shoe{position:absolute;top:302px;width:52px;height:19px;background:#101426;border-radius:14px 8px 6px 6px;z-index:4;border-bottom:4px solid #fff}.doll-shoe.left{left:39px}.doll-shoe.right{right:39px}.player{display:inline-block;background:#071b45dd;border:1px solid #39caff;border-radius:12px;padding:9px 18px;font-weight:900}
.right{display:grid;gap:12px;align-self:center}.tile{background:linear-gradient(120deg,#10285aee,#08112eee);border:1px solid #38baff;border-radius:15px;padding:16px;min-height:100px;cursor:pointer;text-align:left;color:white;transition:.15s}.tile:hover{transform:translateX(-4px);border-color:#ffe32b}.tile strong{display:block;font-size:18px}.tile span{font-size:13px;color:#8beaff}
.bottom{position:absolute;bottom:15px;left:3%;right:3%;display:flex;gap:10px;z-index:2}.bottom button{flex:1;background:#071a43ef;border:1px solid #4a9fff;border-radius:12px;color:white;padding:14px 8px;font-weight:900;cursor:pointer}.bottom button:hover{background:#342080}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#081b3b;border:1px solid #45d4ff;border-radius:12px;padding:14px 20px;z-index:5;transition:.25s;box-shadow:0 0 24px #008cff88;text-align:center;width:min(90%,500px)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){nav{overflow-x:auto}.content{grid-template-columns:1fr 1fr}.center{display:none}.right{grid-column:2}.headline{font-size:48px}.bottom{flex-wrap:wrap}.bottom button{min-width:30%}}
@media(max-width:560px){nav button{padding:10px;font-size:12px}.content{display:block;padding:22px 4% 175px}.left{margin-top:8vh}.right{margin-top:18px;grid-template-columns:1fr 1fr}.tile{min-height:90px;padding:12px}.bottom{left:4%;right:4%;bottom:10px}.bottom button{font-size:11px;padding:10px 5px}.headline{font-size:54px}.avatar{display:none}}
</style>
</head>
<body>

 <div class="logo">👑 ADAM<br>ROYALE</div>

 <section class="right"><button class="tile" onclick="notify('La tienda de skins llegará próximamente.')"><strong>👕 TIENDA DE SKINS</strong><span>Descubre nuevos aspectos</span></button><button class="tile" onclick="notify('El mapa 3D está en desarrollo.')"><strong>🌍 EXPLORA EL MAPA</strong><span>Descubre todos los lugares</span></button><button class="tile" onclick="notify('El modo construcción está en desarrollo.')"><strong>🧱 CONSTRUYE</strong><span>Crea tus propias estructuras</span></button></section>
</main>
<div class="bottom"><button onclick="notify('Los torneos estarán disponibles próximamente.')">🏆 TORNEOS</button><button onclick="notify('El multijugador con amigos está en desarrollo.')">👥 MULTIJUGADOR</button><button onclick="notify('El pase de batalla llegará próximamente.')">👑 PASE DE BATALLA</button><button onclick="notify('¡Próximamente habrá recompensas!')">🎁 RECOMPENSAS</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
let timer;function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),3200)}
document.querySelectorAll('nav button[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(btn.dataset.tab!=='INICIO')notify(btn.dataset.tab+': sección preparada para el siguiente paso.')}))
</script>

</html>
